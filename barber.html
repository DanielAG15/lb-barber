<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Leo Berrio - LEO BERRIO BARBERO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandblue: {
                            light: '#00D2FF',
                            DEFAULT: '#0088FF',
                            dark: '#0055FF'
                        },
                        pureblack: '#05070A',
                        cardgray: '#0F141C',
                        cardborder: '#1A2333'
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .blue-gradient { background: linear-gradient(135deg, #00D2FF 0%, #0055FF 100%); }
        .blue-text-gradient {
            background: linear-gradient(135deg, #00D2FF 0%, #0099FF 50%, #0055FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-pureblack text-gray-100 min-h-screen pb-10">

    <!-- Encabezado Barbero con Logo -->
    <header class="bg-[#0A0D14] pt-6 pb-4 px-6 rounded-b-[2.5rem] mb-8 border-b border-brandblue/20 shadow-[0_4px_30px_rgba(0,136,255,0.1)]">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <img src="logo.png" alt="Leo Berrio Barbero Logo" class="h-16 object-contain drop-shadow-[0_0_10px_rgba(0,136,255,0.4)]">
            <span class="bg-brandblue/10 text-brandblue-light text-xs font-extrabold px-3 py-1.5 rounded-xl border border-brandblue/30 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-brandblue-light animate-ping"></span> Panel Barbero
            </span>
        </div>
    </header>

    <main class="px-5 max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-black uppercase tracking-wide text-white flex items-center gap-2">
                <i class="fa-solid fa-users text-brandblue-light"></i> Clientes en Fila
            </h2>
            <span id="counter-badge" class="text-xs font-extrabold bg-cardgray text-gray-400 px-3 py-1 rounded-xl border border-cardborder">0 en espera</span>
        </div>

        <ul id="lista-turnos" class="space-y-4">
            <!-- Los turnos se cargan dinámicamente -->
        </ul>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMJ6SCdXlP0JKKTt2V7JO0PYESX_2X2Tg",
            authDomain: "lb-barber.firebaseapp.com",
            projectId: "lb-barber",
            storageBucket: "lb-barber.firebasestorage.app",
            messagingSenderId: "1000304893965",
            appId: "1:1000304893965:web:4d11deba190090c08cf544"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const turnosRef = collection(db, "turnos");
        const q = query(turnosRef, orderBy("createdAt", "asc"));

        let turnosActuales = [];

        window.llamarCliente = async (id) => {
            await updateDoc(doc(db, "turnos", id), { status: 'llamando', llamadoAt: Date.now() });
        };
        
        window.marcarAtendido = async (id) => {
            await updateDoc(doc(db, "turnos", id), { status: 'atendido' });
        };
        
        window.marcarAusente = async (id) => {
            if(confirm('¿El cliente no respondió al llamado?')) {
                await updateDoc(doc(db, "turnos", id), { status: 'ausente' });
            }
        };

        setInterval(() => {
            turnosActuales.forEach(t => {
                if(t.status === 'llamando' && t.llamadoAt) {
                    const transcurrido = Date.now() - t.llamadoAt;
                    const restante = 180000 - transcurrido;
                    
                    const contadorEl = document.getElementById(`timer-${t.id}`);
                    if(contadorEl) {
                        if (restante <= 0) {
                            contadorEl.innerHTML = '<span class="text-red-500 font-black">¡TIEMPO AGOTADO!</span>';
                            updateDoc(doc(db, "turnos", t.id), { status: 'ausente' });
                        } else {
                            const minutos = Math.floor(restante / 60000);
                            const segundos = Math.floor((restante % 60000) / 1000).toString().padStart(2, '0');
                            contadorEl.innerHTML = `<i class="fa-solid fa-stopwatch mr-1"></i> ${minutos}:${segundos}`;
                        }
                    }
                }
            });
        }, 1000);

        onSnapshot(q, (snapshot) => {
            // Filtra solo los turnos estrictamente en estado 'espera' o 'llamando'
            turnosActuales = snapshot.docs.map(d => ({id: d.id, ...d.data()})).filter(t => t.status === 'espera' || t.status === 'llamando');
            const lista = document.getElementById('lista-turnos');
            const counterBadge = document.getElementById('counter-badge');
            
            counterBadge.textContent = `${turnosActuales.length} en espera`;
            lista.innerHTML = '';

            if(turnosActuales.length === 0) {
                lista.innerHTML = `
                    <div class="text-center py-12 bg-cardgray rounded-3xl border border-cardborder">
                        <i class="fa-solid fa-chair text-4xl text-gray-700 mb-3"></i>
                        <p class="text-gray-500 font-bold">Sin clientes en espera por ahora.</p>
                    </div>`;
                return;
            }

            turnosActuales.forEach((cliente, index) => {
                const li = document.createElement('li');
                li.className = 'bg-cardgray p-5 rounded-3xl border border-cardborder shadow-lg transition-all';
                
                if (cliente.status === 'espera') {
                    li.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-lg font-bold capitalize text-white flex items-center gap-2">
                                <span class="text-brandblue-light font-black text-xl">#${index + 1}</span> 
                                ${cliente.name}
                            </span>
                        </div>
                        <button onclick="llamarCliente('${cliente.id}')" class="w-full blue-gradient hover:opacity-90 text-white font-black py-3.5 rounded-2xl transition-all shadow-md active:scale-95 uppercase tracking-wide text-sm">
                            <i class="fa-solid fa-bell mr-2"></i> Llamar al Cliente
                        </button>
                    `;
                } else if (cliente.status === 'llamando') {
                    li.classList.add('border-brandblue', 'shadow-[0_0_20px_rgba(0,136,255,0.25)]');
                    li.innerHTML = `
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xl font-black capitalize blue-text-gradient">${cliente.name}</span>
                            <span id="timer-${cliente.id}" class="text-sm font-extrabold text-red-400 bg-red-500/10 border border-red-500/20 px-3 py-1 rounded-xl">...</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-4 flex items-center gap-1">
                            <i class="fa-solid fa-signal text-brandblue-light"></i> Celular notificado y vibrando...
                        </p>
                        <div class="flex gap-2">
                            <button onclick="marcarAtendido('${cliente.id}')" class="flex-1 bg-green-500/15 text-green-400 border border-green-500/30 hover:bg-green-500 hover:text-white font-black py-3 rounded-xl transition-all text-sm">
                                <i class="fa-solid fa-check mr-1"></i> ¡LLEGÓ!
                            </button>
                            <button onclick="marcarAusente('${cliente.id}')" class="flex-1 bg-red-500/15 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white font-black py-3 rounded-xl transition-all text-sm">
                                <i class="fa-solid fa-xmark mr-1"></i> AUSENTE
                            </button>
                        </div>
                    `;
                }
                lista.appendChild(li);
            });
        });
    </script>
</body>
</html>
